<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breakout / Quebra Tijolos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 480px;
      padding: 10px 4px;
      font-size: 14px;
      font-weight: 700;
    }
    .canvas-wrap {
      position: relative;
      border: 3px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      background: #020617;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      text-align: center;
    }
    .btn {
      margin-top: 14px;
      background: #ec4899;
      color: #fff;
      font-weight: 700;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #f472b6; }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>Pontos: <span id="scoreText" style="color: #ec4899">0</span></div>
    <div>Vidas: <span id="livesText" style="color: #ef4444">❤❤❤</span></div>
  </div>

  <div class="canvas-wrap">
    <canvas id="c" width="480" height="420"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="ovTitle" style="font-size: 26px; color: #ec4899; margin-bottom: 6px;">QUEBRA TIJOLOS</h2>
      <p id="ovDesc" style="color: #94a3b8; font-size: 14px;">Mova a raquete com o mouse ou as setas</p>
      <button id="btnStart" class="btn">INICIAR</button>
    </div>
  </div>

  <div class="hint">Mouse ou Setas Esquerda/Direita para controlar a raquete</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const livesText = document.getElementById('livesText');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const ovDesc = document.getElementById('ovDesc');
    const btnStart = document.getElementById('btnStart');

    const paddle = { w: 80, h: 12, x: 200, y: 390, speed: 7 };
    let ball = { x: 240, y: 350, vx: 3.5, vy: -3.5, r: 6 };
    let score = 0;
    let lives = 3;
    let isRunning = false;

    const brickRowCount = 5;
    const brickColumnCount = 7;
    const brickWidth = 56;
    const brickHeight = 18;
    const brickPadding = 8;
    const brickOffsetTop = 40;
    const brickOffsetLeft = 20;
    const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4'];

    let bricks = [];
    function resetBricks() {
      bricks = [];
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1, color: colors[r] };
        }
      }
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, dur = 0.05) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = f;
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function initGame() {
      score = 0;
      lives = 3;
      scoreText.innerText = score;
      updateLives();
      resetBricks();
      resetBall();
      overlay.style.display = 'none';
      isRunning = true;
    }

    function resetBall() {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - 10;
      ball.vx = (Math.random() > 0.5 ? 3.5 : -3.5);
      ball.vy = -3.5;
    }

    function updateLives() {
      livesText.innerText = '❤'.repeat(lives);
    }

    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
      if (!isRunning && e.key === ' ') initGame();
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const rootX = e.clientX - rect.left;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, rootX - paddle.w / 2));
    });

    function collisionDetection() {
      let activeCount = 0;
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            activeCount++;
            if (
              ball.x > b.x &&
              ball.x < b.x + brickWidth &&
              ball.y > b.y &&
              ball.y < b.y + brickHeight
            ) {
              ball.vy = -ball.vy;
              b.status = 0;
              score += (brickRowCount - r) * 10;
              scoreText.innerText = score;
              beep(300 + (brickRowCount - r) * 80);
            }
          }
        }
      }
      if (activeCount === 0) {
        // Victory!
        isRunning = false;
        ovTitle.innerText = 'VITÓRIA!';
        ovDesc.innerText = `Você destruiu todos os tijolos! Pontos: ${score}`;
        btnStart.innerText = 'JOGAR NOVAMENTE';
        overlay.style.display = 'flex';
      }
    }

    function update() {
      if (!isRunning) return;

      if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
        paddle.x = Math.max(0, paddle.x - paddle.speed);
      }
      if (keys['ArrowRight'] || keys['d'] || keys['D']) {
        paddle.x = Math.min(canvas.width - paddle.w, paddle.x + paddle.speed);
      }

      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall bounce
      if (ball.x + ball.r > canvas.width || ball.x - ball.r < 0) {
        ball.vx = -ball.vx;
        beep(220);
      }
      if (ball.y - ball.r < 0) {
        ball.vy = -ball.vy;
        beep(220);
      }

      // Paddle hit
      if (
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.w
      ) {
        ball.vy = -Math.abs(ball.vy);
        const hitOffset = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        ball.vx = hitOffset * 4.5;
        beep(400);
      }

      // Bottom death
      if (ball.y - ball.r > canvas.height) {
        lives--;
        updateLives();
        beep(140, 0.2);
        if (lives <= 0) {
          isRunning = false;
          ovTitle.innerText = 'FIM DE JOGO!';
          ovDesc.innerText = `Sua pontuação: ${score}`;
          btnStart.innerText = 'TENTAR NOVAMENTE';
          overlay.style.display = 'flex';
        } else {
          resetBall();
        }
      }

      collisionDetection();
    }

    function render() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw bricks
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          if (bricks[c] && bricks[c][r].status === 1) {
            const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
            const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.fillStyle = bricks[c][r].color;
            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 4) : ctx.rect(brickX, brickY, brickWidth, brickHeight);
            ctx.fill();
          }
        }
      }

      // Draw paddle
      ctx.fillStyle = '#ec4899';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6) : ctx.rect(paddle.x, paddle.y, paddle.w, paddle.h);
      ctx.fill();

      // Draw ball
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    btnStart.addEventListener('click', initGame);
    resetBricks();
    render();
    loop();
  </script>
</body>
</html>
