<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocos Tetris</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-area {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      border: 3px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      background: #020617;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    canvas {
      display: block;
      border: 2px solid #1e293b;
      border-radius: 6px;
      background: #050a14;
    }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 110px;
    }
    .panel-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .box-title {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
    }
    .box-value {
      font-size: 18px;
      font-weight: 800;
      color: #38bdf8;
      margin-top: 2px;
    }
    .btn {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 800;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 4px;
    }
    .btn:hover { background: #7dd3fc; }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="game-area">
    <canvas id="c" width="220" height="440"></canvas>
    <div class="side-panel">
      <div class="panel-box">
        <div class="box-title">Pontos</div>
        <div class="box-value" id="score">0</div>
      </div>
      <div class="panel-box">
        <div class="box-title">Linhas</div>
        <div class="box-value" id="lines">0</div>
      </div>
      <div class="panel-box">
        <div class="box-title">Próxima</div>
        <canvas id="nextCanvas" width="80" height="80" style="margin: 4px auto 0;"></canvas>
      </div>
      <button class="btn" id="startBtn" onclick="initGame()">Novo Jogo</button>
    </div>
  </div>

  <div class="hint">Setas Esquerda/Direita: Mover · Cima: Girar · Baixo: Descer rápido · Espaço: Queda Instantânea</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('nextCanvas');
    const nextCtx = nextCanvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 22;

    const SHAPES = [
      { shape: [[1,1,1,1]], color: '#06b6d4' }, // I
      { shape: [[1,1],[1,1]], color: '#eab308' }, // O
      { shape: [[0,1,0],[1,1,1]], color: '#a855f7' }, // T
      { shape: [[1,0,0],[1,1,1]], color: '#3b82f6' }, // J
      { shape: [[0,0,1],[1,1,1]], color: '#f97316' }, // L
      { shape: [[0,1,1],[1,1,0]], color: '#22c55e' }, // S
      { shape: [[1,1,0],[0,1,1]], color: '#ef4444' }  // Z
    ];

    let grid = [];
    let curPiece = null;
    let nextPiece = null;
    let score = 0;
    let lines = 0;
    let dropCounter = 0;
    let lastTime = 0;
    let isGameOver = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, dur = 0.05) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = f;
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function initGame() {
      grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
      score = 0;
      lines = 0;
      isGameOver = false;
      scoreEl.innerText = score;
      linesEl.innerText = lines;
      nextPiece = getRandomPiece();
      spawnPiece();
    }

    function getRandomPiece() {
      const p = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      return {
        matrix: p.shape,
        color: p.color,
        x: 0,
        y: 0
      };
    }

    function spawnPiece() {
      curPiece = nextPiece;
      curPiece.x = Math.floor((COLS - curPiece.matrix[0].length) / 2);
      curPiece.y = 0;
      nextPiece = getRandomPiece();
      drawNext();

      if (collide(curPiece.x, curPiece.y, curPiece.matrix)) {
        isGameOver = true;
      }
    }

    function drawNext() {
      nextCtx.fillStyle = '#050a14';
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      const m = nextPiece.matrix;
      const bSize = 16;
      const ox = (nextCanvas.width - m[0].length * bSize) / 2;
      const oy = (nextCanvas.height - m.length * bSize) / 2;

      for (let r = 0; r < m.length; r++) {
        for (let c = 0; c < m[r].length; c++) {
          if (m[r][c]) {
            nextCtx.fillStyle = nextPiece.color;
            nextCtx.fillRect(ox + c * bSize, oy + r * bSize, bSize - 1, bSize - 1);
          }
        }
      }
    }

    function collide(px, py, matrix) {
      for (let r = 0; r < matrix.length; r++) {
        for (let c = 0; c < matrix[r].length; c++) {
          if (matrix[r][c]) {
            const nx = px + c;
            const ny = py + r;
            if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
            if (ny >= 0 && grid[ny][nx]) return true;
          }
        }
      }
      return false;
    }

    function merge() {
      for (let r = 0; r < curPiece.matrix.length; r++) {
        for (let c = 0; c < curPiece.matrix[r].length; c++) {
          if (curPiece.matrix[r][c]) {
            if (curPiece.y + r >= 0) {
              grid[curPiece.y + r][curPiece.x + c] = curPiece.color;
            }
          }
        }
      }
    }

    function rotate(matrix) {
      const rows = matrix.length;
      const cols = matrix[0].length;
      const res = Array(cols).fill(null).map(() => Array(rows).fill(0));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          res[c][rows - 1 - r] = matrix[r][c];
        }
      }
      return res;
    }

    function clearLines() {
      let cleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].every(c => c !== 0)) {
          grid.splice(r, 1);
          grid.unshift(Array(COLS).fill(0));
          cleared++;
          r++;
        }
      }
      if (cleared > 0) {
        lines += cleared;
        score += [0, 100, 300, 500, 800][cleared] || 1000;
        scoreEl.innerText = score;
        linesEl.innerText = lines;
        beep(520, 0.15);
      }
    }

    function drop() {
      if (isGameOver) return;
      if (!collide(curPiece.x, curPiece.y + 1, curPiece.matrix)) {
        curPiece.y++;
      } else {
        merge();
        clearLines();
        spawnPiece();
        beep(180, 0.04);
      }
      dropCounter = 0;
    }

    function hardDrop() {
      if (isGameOver) return;
      while (!collide(curPiece.x, curPiece.y + 1, curPiece.matrix)) {
        curPiece.y++;
      }
      drop();
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
      if (isGameOver) return;

      if (e.key === 'ArrowLeft') {
        if (!collide(curPiece.x - 1, curPiece.y, curPiece.matrix)) curPiece.x--;
      } else if (e.key === 'ArrowRight') {
        if (!collide(curPiece.x + 1, curPiece.y, curPiece.matrix)) curPiece.x++;
      } else if (e.key === 'ArrowDown') {
        drop();
      } else if (e.key === 'ArrowUp') {
        const rotated = rotate(curPiece.matrix);
        if (!collide(curPiece.x, curPiece.y, rotated)) {
          curPiece.matrix = rotated;
          beep(350, 0.04);
        }
      } else if (e.key === ' ') {
        hardDrop();
      }
    });

    function draw() {
      ctx.fillStyle = '#050a14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw grid
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c]) {
            ctx.fillStyle = grid[r][c];
            ctx.fillRect(c * BLOCK, r * BLOCK, BLOCK - 1, BLOCK - 1);
          } else {
            ctx.strokeStyle = '#0b1329';
            ctx.strokeRect(c * BLOCK, r * BLOCK, BLOCK, BLOCK);
          }
        }
      }

      // Draw ghost piece
      if (curPiece && !isGameOver) {
        let ghostY = curPiece.y;
        while (!collide(curPiece.x, ghostY + 1, curPiece.matrix)) {
          ghostY++;
        }
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        for (let r = 0; r < curPiece.matrix.length; r++) {
          for (let c = 0; c < curPiece.matrix[r].length; c++) {
            if (curPiece.matrix[r][c]) {
              ctx.fillRect((curPiece.x + c) * BLOCK, (ghostY + r) * BLOCK, BLOCK - 1, BLOCK - 1);
            }
          }
        }

        // Draw active piece
        ctx.fillStyle = curPiece.color;
        for (let r = 0; r < curPiece.matrix.length; r++) {
          for (let c = 0; c < curPiece.matrix[r].length; c++) {
            if (curPiece.matrix[r][c]) {
              ctx.fillRect((curPiece.x + c) * BLOCK, (curPiece.y + r) * BLOCK, BLOCK - 1, BLOCK - 1);
            }
          }
        }
      }

      if (isGameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = '800 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('FIM DE JOGO', canvas.width / 2, canvas.height / 2 - 10);
      }
    }

    function updateGame(time = 0) {
      const dt = time - lastTime;
      lastTime = time;
      dropCounter += dt;
      if (dropCounter > 650) {
        drop();
      }
      draw();
      requestAnimationFrame(updateGame);
    }

    initGame();
    updateGame();
  </script>
</body>
</html>
