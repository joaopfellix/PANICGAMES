<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Retrô</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .score-badge { color: #10b981; }
    .high-badge { color: #f59e0b; }
    .canvas-container {
      position: relative;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      background: #030712;
    }
    canvas {
      display: block;
      border-radius: 10px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      text-align: center;
      padding: 20px;
    }
    .overlay h2 {
      font-size: 28px;
      color: #10b981;
      margin-bottom: 8px;
    }
    .overlay p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .btn {
      background: #10b981;
      color: #030712;
      border: none;
      padding: 10px 24px;
      font-weight: 700;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .btn:hover { background: #34d399; transform: scale(1.04); }
    .controls-hint {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
    }
    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 50px);
      gap: 8px;
      margin-top: 12px;
    }
    @media (max-width: 600px) {
      .touch-controls { display: grid; }
    }
    .touch-btn {
      background: #1e293b;
      color: #e2e8f0;
      border: none;
      border-radius: 8px;
      height: 48px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    .touch-btn:active { background: #334155; }
  </style>
</head>
<body>
  <div class="hud">
    <div>Pontos: <span id="score" class="score-badge">0</span></div>
    <div>Recorde: <span id="highScore" class="high-badge">0</span></div>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlayTitle">SNAKE RETRÔ</h2>
      <p id="overlaySub">Use as setas ou WASD para movimentar</p>
      <button id="startBtn" class="btn">JOGAR AGORA</button>
    </div>
  </div>

  <div class="touch-controls">
    <div></div>
    <button class="touch-btn" onclick="sendKey('ArrowUp')">▲</button>
    <div></div>
    <button class="touch-btn" onclick="sendKey('ArrowLeft')">◀</button>
    <button class="touch-btn" onclick="sendKey('ArrowDown')">▼</button>
    <button class="touch-btn" onclick="sendKey('ArrowRight')">▶</button>
  </div>

  <div class="controls-hint">Use Setas ou WASD · Pressione Espaço para Reiniciar</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');

    const GRID = 20;
    const COUNT = canvas.width / GRID;
    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 1, dy = 0;
    let nextDx = 1, nextDy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_highscore') || 0;
    highScoreEl.innerText = highScore;
    let gameLoop = null;
    let isRunning = false;

    // Web Audio Sound FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.08) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      scoreEl.innerText = score;
      spawnFood();
      overlay.style.display = 'none';
      isRunning = true;
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 110);
    }

    function spawnFood() {
      while (true) {
        food = {
          x: Math.floor(Math.random() * COUNT),
          y: Math.floor(Math.random() * COUNT)
        };
        const collision = snake.some(seg => seg.x === food.x && seg.y === food.y);
        if (!collision) break;
      }
    }

    function update() {
      dx = nextDx;
      dy = nextDy;
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= COUNT || head.y < 0 || head.y >= COUNT) {
        return gameOver();
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.innerText = highScore;
          localStorage.setItem('snake_highscore', highScore);
        }
        playBeep(580, 'sine', 0.1);
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw subtle grid
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw food
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw snake
      snake.forEach((seg, i) => {
        if (i === 0) {
          ctx.fillStyle = '#34d399';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 6;
        } else {
          ctx.fillStyle = '#059669';
          ctx.shadowBlur = 0;
        }
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
      });
      ctx.shadowBlur = 0;
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      playBeep(180, 'sawtooth', 0.25);
      overlayTitle.innerText = 'FIM DE JOGO!';
      overlaySub.innerText = `Você fez ${score} pontos. Recorde: ${highScore}`;
      startBtn.innerText = 'TENTAR NOVAMENTE';
      overlay.style.display = 'flex';
    }

    function sendKey(key) {
      if (!isRunning) {
        initGame();
        return;
      }
      if ((key === 'ArrowUp' || key === 'w' || key === 'W') && dy === 0) {
        nextDx = 0; nextDy = -1;
      } else if ((key === 'ArrowDown' || key === 's' || key === 'S') && dy === 0) {
        nextDx = 0; nextDy = 1;
      } else if ((key === 'ArrowLeft' || key === 'a' || key === 'A') && dx === 0) {
        nextDx = -1; nextDy = 0;
      } else if ((key === 'ArrowRight' || key === 'd' || key === 'D') && dx === 0) {
        nextDx = 1; nextDy = 0;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
        e.preventDefault();
      }
      if (e.key === ' ') {
        if (!isRunning) initGame();
        return;
      }
      sendKey(e.key);
    });

    startBtn.addEventListener('click', initGame);
    draw();
  </script>
</body>
</html>
