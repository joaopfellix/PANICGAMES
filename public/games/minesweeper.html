<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campo Minado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .board-frame {
      background: #1e293b;
      border: 3px solid #334155;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 8px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-family: monospace;
      font-size: 20px;
      font-weight: 700;
    }
    .counter {
      color: #ef4444;
      background: #020617;
      padding: 4px 8px;
      border-radius: 4px;
      min-width: 50px;
      text-align: center;
    }
    .timer {
      color: #38bdf8;
      background: #020617;
      padding: 4px 8px;
      border-radius: 4px;
      min-width: 50px;
      text-align: center;
    }
    .face-btn {
      background: #334155;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .face-btn:active { transform: scale(0.92); }
    .grid {
      display: grid;
      gap: 3px;
      background: #0f172a;
      padding: 6px;
      border-radius: 8px;
    }
    .cell {
      width: 34px;
      height: 34px;
      background: #334155;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.1s;
    }
    .cell:hover:not(.revealed) { background: #475569; }
    .cell.revealed { background: #0f172a; cursor: default; }
    .cell.mine { background: #ef4444 !important; }
    .cell[data-num="1"] { color: #38bdf8; }
    .cell[data-num="2"] { color: #22c55e; }
    .cell[data-num="3"] { color: #f43f5e; }
    .cell[data-num="4"] { color: #a855f7; }
    .cell[data-num="5"] { color: #f59e0b; }
    .cell[data-num="6"] { color: #06b6d4; }
    .modes {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .mode-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      font-weight: 700;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
    .flag-toggle {
      display: none;
      margin-top: 10px;
      background: #334155;
      border: 1px solid #475569;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .flag-toggle.active {
      background: #ef4444;
      border-color: #ef4444;
    }
    @media (max-width: 600px) {
      .flag-toggle { display: block; }
    }
  </style>
</head>
<body>
  <div class="board-frame">
    <div class="top-bar">
      <div class="counter" id="mineCount">010</div>
      <button class="face-btn" id="faceBtn" onclick="initGame()">🙂</button>
      <div class="timer" id="timer">000</div>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <button id="flagToggle" class="flag-toggle" onclick="toggleFlagMode()">🚩 Modo Bandeira: Desligado</button>

  <div class="modes">
    <button class="mode-btn active" id="btnEasy" onclick="setDiff(9, 9, 10)">Fácil (9x9 - 10 Minas)</button>
    <button class="mode-btn" id="btnMed" onclick="setDiff(11, 11, 20)">Médio (11x11 - 20 Minas)</button>
  </div>

  <div class="hint">Clique esquerdo: Revelar · Clique direito: Marcar Bandeira 🚩</div>

  <script>
    let ROWS = 9;
    let COLS = 9;
    let MINES = 10;

    let board = [];
    let isGameOver = false;
    let timerVal = 0;
    let timerId = null;
    let flagMode = false;
    let flagsPlaced = 0;
    let firstClick = true;

    const gridEl = document.getElementById('grid');
    const mineCountEl = document.getElementById('mineCount');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('faceBtn');
    const flagToggle = document.getElementById('flagToggle');

    function setDiff(r, c, m) {
      ROWS = r; COLS = c; MINES = m;
      document.getElementById('btnEasy').classList.toggle('active', m === 10);
      document.getElementById('btnMed').classList.toggle('active', m === 20);
      initGame();
    }

    function toggleFlagMode() {
      flagMode = !flagMode;
      flagToggle.classList.toggle('active', flagMode);
      flagToggle.innerText = flagMode ? '🚩 Modo Bandeira: LIGADO' : '🚩 Modo Bandeira: Desligado';
    }

    function initGame() {
      if (timerId) clearInterval(timerId);
      timerVal = 0;
      timerId = null;
      timerEl.innerText = '000';
      isGameOver = false;
      firstClick = true;
      flagsPlaced = 0;
      updateMineCounter();
      faceBtn.innerText = '🙂';

      gridEl.style.gridTemplateColumns = `repeat(${COLS}, 34px)`;
      gridEl.innerHTML = '';
      board = [];

      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          const cell = {
            r, c,
            isMine: false,
            revealed: false,
            flagged: false,
            count: 0,
            el: null
          };
          const div = document.createElement('div');
          div.className = 'cell';
          div.addEventListener('click', (e) => onCellClick(r, c));
          div.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });
          cell.el = div;
          gridEl.appendChild(div);
          board[r][c] = cell;
        }
      }
    }

    function placeMines(firstR, firstC) {
      let placed = 0;
      while (placed < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if (!board[r][c].isMine && !(r === firstR && c === firstC)) {
          board[r][c].isMine = true;
          placed++;
        }
      }

      // Calculate counts
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].isMine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) {
                  count++;
                }
              }
            }
            board[r][c].count = count;
          }
        }
      }
    }

    function startTimer() {
      timerId = setInterval(() => {
        timerVal++;
        timerEl.innerText = String(Math.min(999, timerVal)).padStart(3, '0');
      }, 1000);
    }

    function updateMineCounter() {
      const left = MINES - flagsPlaced;
      mineCountEl.innerText = String(Math.max(-99, left)).padStart(3, '0');
    }

    function toggleFlag(r, c) {
      if (isGameOver || board[r][c].revealed) return;
      const cell = board[r][c];
      cell.flagged = !cell.flagged;
      cell.el.innerText = cell.flagged ? '🚩' : '';
      flagsPlaced += cell.flagged ? 1 : -1;
      updateMineCounter();
    }

    function onCellClick(r, c) {
      if (isGameOver) return;
      if (flagMode) {
        toggleFlag(r, c);
        return;
      }
      const cell = board[r][c];
      if (cell.flagged || cell.revealed) return;

      if (firstClick) {
        firstClick = false;
        placeMines(r, c);
        startTimer();
      }

      if (cell.isMine) {
        // Explode
        gameOver(false, r, c);
        return;
      }

      reveal(r, c);
      checkWin();
    }

    function reveal(r, c) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
      const cell = board[r][c];
      if (cell.revealed || cell.flagged || cell.isMine) return;

      cell.revealed = true;
      cell.el.classList.add('revealed');

      if (cell.count > 0) {
        cell.el.innerText = cell.count;
        cell.el.dataset.num = cell.count;
      } else {
        // Flood empty
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr !== 0 || dc !== 0) reveal(r + dr, c + dc);
          }
        }
      }
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].isMine && !board[r][c].revealed) {
            unrevealedSafe++;
          }
        }
      }
      if (unrevealedSafe === 0) {
        gameOver(true);
      }
    }

    function gameOver(won, hitR, hitC) {
      isGameOver = true;
      if (timerId) clearInterval(timerId);

      faceBtn.innerText = won ? '😎' : '😵';

      // Reveal all mines
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = board[r][c];
          if (cell.isMine) {
            cell.el.innerText = '💣';
            if (r === hitR && c === hitC) {
              cell.el.classList.add('mine');
            }
          }
        }
      }
    }

    initGame();
  </script>
</body>
</html>
