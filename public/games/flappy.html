<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Bird</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-box {
      position: relative;
      border: 3px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      background: #38bdf8;
    }
    canvas { display: block; }
    .hud {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 24px;
      font-weight: 800;
      text-shadow: 2px 2px 0 #000;
      z-index: 5;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }
    .btn {
      margin-top: 16px;
      background: #f59e0b;
      color: #0f172a;
      font-weight: 800;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
    }
    .btn:hover { background: #fbbf24; }
    .footer-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="hud">
      <span id="scoreText">0</span>
    </div>
    <canvas id="c" width="340" height="480"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="ovTitle" style="font-size: 28px; margin-bottom: 8px; color: #fbbf24;">FLAPPY BIRD</h2>
      <p id="ovDesc" style="font-size: 14px; color: #94a3b8;">Pressione Espaço, Clique ou Toque para Voar</p>
      <button id="startBtn" class="btn">INICIAR JOGO</button>
    </div>
  </div>
  <div class="footer-hint">Espaço / Clique para Pular · Evite os Canos</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const ovDesc = document.getElementById('ovDesc');
    const startBtn = document.getElementById('startBtn');

    let bird = { x: 60, y: 200, vy: 0, r: 12 };
    const GRAVITY = 0.28;
    const JUMP = -5.6;
    let pipes = [];
    let score = 0;
    let highScore = localStorage.getItem('flappy_best') || 0;
    let isPlaying = false;
    let frames = 0;

    // Web Audio Sound FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, duration = 0.08) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function reset() {
      bird = { x: 60, y: 200, vy: 0, r: 12 };
      pipes = [];
      score = 0;
      frames = 0;
      scoreText.innerText = '0';
      isPlaying = true;
      overlay.style.display = 'none';
    }

    function jump() {
      if (!isPlaying) {
        reset();
        return;
      }
      bird.vy = JUMP;
      beep(620, 0.06);
    }

    function loop() {
      if (isPlaying) {
        frames++;
        bird.vy += GRAVITY;
        bird.y += bird.vy;

        // Spawn pipes
        if (frames % 100 === 0) {
          const gap = 110;
          const topH = Math.floor(Math.random() * (canvas.height - gap - 100)) + 40;
          pipes.push({
            x: canvas.width,
            top: topH,
            bottom: canvas.height - topH - gap,
            passed: false
          });
        }

        // Update pipes
        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= 2;

          // Check score
          if (!p.passed && p.x + 48 < bird.x) {
            p.passed = true;
            score++;
            scoreText.innerText = score;
            beep(880, 0.1);
          }

          // Check collision
          if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + 48) {
            if (bird.y - bird.r < p.top || bird.y + bird.r > canvas.height - p.bottom) {
              gameOver();
            }
          }

          if (p.x < -60) pipes.splice(i, 1);
        }

        // Floor / ceiling collision
        if (bird.y + bird.r >= canvas.height - 20 || bird.y - bird.r <= 0) {
          gameOver();
        }
      }

      render();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      isPlaying = false;
      beep(150, 0.3);
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('flappy_best', highScore);
      }
      ovTitle.innerText = 'FIM DE JOGO!';
      ovDesc.innerText = `Pontuação: ${score} · Recorde: ${highScore}`;
      startBtn.innerText = 'TENTAR NOVAMENTE';
      overlay.style.display = 'flex';
    }

    function render() {
      // Sky
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.beginPath();
      ctx.arc(80, 100, 24, 0, Math.PI * 2);
      ctx.arc(110, 95, 30, 0, Math.PI * 2);
      ctx.arc(140, 100, 22, 0, Math.PI * 2);
      ctx.fill();

      // Pipes
      pipes.forEach(p => {
        ctx.fillStyle = '#22c55e';
        ctx.strokeStyle = '#15803d';
        ctx.lineWidth = 3;

        // Top pipe
        ctx.fillRect(p.x, 0, 48, p.top);
        ctx.strokeRect(p.x, 0, 48, p.top);
        ctx.fillRect(p.x - 3, p.top - 16, 54, 16);
        ctx.strokeRect(p.x - 3, p.top - 16, 54, 16);

        // Bottom pipe
        const bottomY = canvas.height - p.bottom;
        ctx.fillRect(p.x, bottomY, 48, p.bottom);
        ctx.strokeRect(p.x, bottomY, 48, p.bottom);
        ctx.fillRect(p.x - 3, bottomY, 54, 16);
        ctx.strokeRect(p.x - 3, bottomY, 54, 16);
      });

      // Ground
      ctx.fillStyle = '#84cc16';
      ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
      ctx.fillStyle = '#4d7c0f';
      ctx.fillRect(0, canvas.height - 6, canvas.width, 6);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.08));
      ctx.rotate(angle);

      // Body
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ca8a04';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Wing
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(5, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(6, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(10, -2);
      ctx.lineTo(16, 2);
      ctx.lineTo(10, 5);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    startBtn.addEventListener('click', reset);
    canvas.addEventListener('click', jump);
    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'ArrowUp') {
        e.preventDefault();
        jump();
      }
    });

    render();
    loop();
  </script>
</body>
</html>
