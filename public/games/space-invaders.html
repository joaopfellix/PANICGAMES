<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invasores do Espaço</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 480px;
      padding: 10px 4px;
      font-size: 14px;
      font-weight: 700;
    }
    .canvas-wrap {
      position: relative;
      border: 3px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      background: #000;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      text-align: center;
    }
    .btn {
      margin-top: 14px;
      background: #10b981;
      color: #000;
      font-weight: 800;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #34d399; }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>Pontos: <span id="scoreText" style="color: #10b981">0</span></div>
    <div>Vidas: <span id="livesText" style="color: #ef4444">❤❤❤</span></div>
  </div>

  <div class="canvas-wrap">
    <canvas id="c" width="480" height="420"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="ovTitle" style="font-size: 26px; color: #10b981; margin-bottom: 6px;">INVASORES DO ESPAÇO</h2>
      <p id="ovDesc" style="color: #94a3b8; font-size: 14px;">Defenda a Terra da invasão alienígena!</p>
      <button id="btnStart" class="btn">INICIAR MISSÃO</button>
    </div>
  </div>

  <div class="hint">Setas / A-D para Mover · Barra de Espaço para Atirar</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const livesText = document.getElementById('livesText');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const ovDesc = document.getElementById('ovDesc');
    const btnStart = document.getElementById('btnStart');

    let player = { x: 220, y: 380, w: 28, h: 16, speed: 5 };
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let enemyDir = 1;
    let enemySpeed = 1;
    let enemyDrop = false;
    let score = 0;
    let lives = 3;
    let isRunning = false;
    let lastShoot = 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, dur = 0.05, type = 'square') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = f;
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function initGame() {
      score = 0;
      lives = 3;
      scoreText.innerText = score;
      livesText.innerText = '❤❤❤';
      bullets = [];
      enemyBullets = [];
      spawnEnemies();
      player.x = 220;
      overlay.style.display = 'none';
      isRunning = true;
    }

    function spawnEnemies() {
      enemies = [];
      const rows = 4;
      const cols = 8;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: 40 + c * 48,
            y: 35 + r * 30,
            w: 24,
            h: 18,
            alive: true,
            type: r,
            color: r === 0 ? '#f43f5e' : r === 1 ? '#fbbf24' : '#38bdf8'
          });
        }
      }
      enemyDir = 1;
      enemySpeed = 1;
    }

    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
      if (!isRunning && e.key === ' ') initGame();
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    function shoot() {
      const now = performance.now();
      if (now - lastShoot > 250) {
        bullets.push({ x: player.x + player.w / 2 - 2, y: player.y - 6, w: 4, h: 10 });
        beep(800, 0.05, 'triangle');
        lastShoot = now;
      }
    }

    function update() {
      if (!isRunning) return;

      if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
        player.x = Math.max(10, player.x - player.speed);
      }
      if (keys['ArrowRight'] || keys['d'] || keys['D']) {
        player.x = Math.min(canvas.width - player.w - 10, player.x + player.speed);
      }
      if (keys[' ']) {
        shoot();
      }

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= 7;
        if (b.y < -10) {
          bullets.splice(i, 1);
          continue;
        }

        // Check hit alien
        for (let j = 0; j < enemies.length; j++) {
          const e = enemies[j];
          if (e.alive && b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
            e.alive = false;
            bullets.splice(i, 1);
            score += (4 - e.type) * 20;
            scoreText.innerText = score;
            beep(250, 0.1, 'sawtooth');
            break;
          }
        }
      }

      // Enemy Bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.y += 3.5;
        if (eb.y > canvas.height + 10) {
          enemyBullets.splice(i, 1);
          continue;
        }

        // Hit player
        if (eb.x > player.x && eb.x < player.x + player.w && eb.y > player.y && eb.y < player.y + player.h) {
          enemyBullets.splice(i, 1);
          lives--;
          livesText.innerText = '❤'.repeat(Math.max(0, lives));
          beep(120, 0.25, 'sawtooth');
          if (lives <= 0) {
            isRunning = false;
            ovTitle.innerText = 'MISSÃO FALHOU!';
            ovDesc.innerText = `Você foi destruído. Pontuação: ${score}`;
            btnStart.innerText = 'TENTAR NOVAMENTE';
            overlay.style.display = 'flex';
          }
        }
      }

      // Random enemy shooting
      if (Math.random() < 0.03) {
        const aliveEnemies = enemies.filter(e => e.alive);
        if (aliveEnemies.length > 0) {
          const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
          enemyBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, w: 3, h: 8 });
        }
      }

      // Move enemies
      let edgeReached = false;
      const aliveEnemies = enemies.filter(e => e.alive);
      if (aliveEnemies.length === 0) {
        // Next wave!
        score += 500;
        scoreText.innerText = score;
        spawnEnemies();
        enemySpeed += 0.5;
        return;
      }

      aliveEnemies.forEach(e => {
        if ((enemyDir === 1 && e.x + e.w >= canvas.width - 15) || (enemyDir === -1 && e.x <= 15)) {
          edgeReached = true;
        }
      });

      if (edgeReached) {
        enemyDir = -enemyDir;
        aliveEnemies.forEach(e => {
          e.y += 14;
          if (e.y + e.h >= player.y) {
            // Invaded!
            isRunning = false;
            ovTitle.innerText = 'A TERRA FOI INVASORA!';
            ovDesc.innerText = `Os alienígenas pousaram! Pontos: ${score}`;
            btnStart.innerText = 'JOGAR NOVAMENTE';
            overlay.style.display = 'flex';
          }
        });
      } else {
        aliveEnemies.forEach(e => {
          e.x += enemyDir * enemySpeed;
        });
      }
    }

    function render() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#475569';
      for (let i = 0; i < 25; i++) {
        const sx = (i * 97) % canvas.width;
        const sy = (i * 61 + (Date.now() / 80)) % canvas.height;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }

      // Draw player ship
      ctx.fillStyle = '#10b981';
      ctx.fillRect(player.x, player.y + 6, player.w, 10);
      ctx.fillRect(player.x + 8, player.y, 12, 6);
      ctx.fillRect(player.x + 12, player.y - 4, 4, 4);

      // Draw bullets
      ctx.fillStyle = '#38bdf8';
      bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.w, b.h);
      });

      // Draw enemy bullets
      ctx.fillStyle = '#ef4444';
      enemyBullets.forEach(eb => {
        ctx.fillRect(eb.x, eb.y, eb.w, eb.h);
      });

      // Draw enemies
      enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = e.color;
        // Simple alien sprite
        ctx.fillRect(e.x + 4, e.y, e.w - 8, 4);
        ctx.fillRect(e.x, e.y + 4, e.w, 8);
        ctx.fillRect(e.x + 2, e.y + 12, 4, 6);
        ctx.fillRect(e.x + e.w - 6, e.y + 12, 4, 6);
        // eyes
        ctx.fillStyle = '#000';
        ctx.fillRect(e.x + 4, e.y + 6, 4, 4);
        ctx.fillRect(e.x + e.w - 8, e.y + 6, 4, 4);
      });
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    btnStart.addEventListener('click', initGame);
    spawnEnemies();
    render();
    loop();
  </script>
</body>
</html>
