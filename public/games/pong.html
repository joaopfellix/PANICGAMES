<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong Clássico</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-wrap {
      position: relative;
      border: 3px solid #334155;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      background: #020617;
    }
    canvas { display: block; }
    .modes {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .mode-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="modes">
    <button class="mode-btn active" id="btn1P" onclick="setMode('1p')">1 Jogador (vs CPU)</button>
    <button class="mode-btn" id="btn2P" onclick="setMode('2p')">2 Jogadores (W/S & Setas)</button>
  </div>

  <div class="game-wrap">
    <canvas id="c" width="560" height="360"></canvas>
  </div>

  <div class="hint" id="hintText">Jogador 1: W / S ou Mouse · Primeiro a fazer 7 pontos vence!</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const btn1P = document.getElementById('btn1P');
    const btn2P = document.getElementById('btn2P');
    const hintText = document.getElementById('hintText');

    let mode = '1p';
    const WIN_SCORE = 7;
    let p1Score = 0;
    let p2Score = 0;

    const paddleW = 10, paddleH = 70;
    let p1Y = (canvas.height - paddleH) / 2;
    let p2Y = (canvas.height - paddleH) / 2;
    let p1Speed = 0, p2Speed = 0;

    let ball = { x: canvas.width / 2, y: canvas.height / 2, vx: 5, vy: 3, r: 6 };
    let isGameOver = false;
    let winner = '';

    const keys = {};

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, dur = 0.05) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = f;
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function setMode(m) {
      mode = m;
      btn1P.classList.toggle('active', m === '1p');
      btn2P.classList.toggle('active', m === '2p');
      hintText.innerText = m === '1p' 
        ? 'Jogador 1: W/S ou Mouse · CPU Inteligente' 
        : 'Jogador 1: W / S · Jogador 2: Setas Cima / Baixo';
      resetGame();
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.vx = (Math.random() > 0.5 ? 5 : -5) * direction;
      ball.vy = (Math.random() * 4 - 2) || 2;
    }

    function resetGame() {
      p1Score = 0;
      p2Score = 0;
      isGameOver = false;
      winner = '';
      resetBall();
    }

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (['ArrowUp', 'ArrowDown', 'w', 's', ' '].includes(e.key)) e.preventDefault();
      if (isGameOver && e.key === ' ') resetGame();
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    canvas.addEventListener('mousemove', e => {
      if (mode === '1p') {
        const rect = canvas.getBoundingClientRect();
        const rootY = e.clientY - rect.top;
        p1Y = Math.max(0, Math.min(canvas.height - paddleH, rootY - paddleH / 2));
      }
    });

    function update() {
      if (isGameOver) return;

      // Player 1 movement
      if (keys['w'] || keys['W']) p1Y -= 6;
      if (keys['s'] || keys['S']) p1Y += 6;
      p1Y = Math.max(0, Math.min(canvas.height - paddleH, p1Y));

      // Player 2 or CPU
      if (mode === '2p') {
        if (keys['ArrowUp']) p2Y -= 6;
        if (keys['ArrowDown']) p2Y += 6;
      } else {
        // CPU AI with slight lag
        const target = ball.y - paddleH / 2;
        p2Y += (target - p2Y) * 0.085;
      }
      p2Y = Math.max(0, Math.min(canvas.height - paddleH, p2Y));

      // Ball movement
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top/bottom bounce
      if (ball.y - ball.r <= 0 || ball.y + ball.r >= canvas.height) {
        ball.vy = -ball.vy;
        beep(300);
      }

      // Left paddle hit
      if (ball.x - ball.r <= 20 + paddleW && ball.x + ball.r >= 20) {
        if (ball.y >= p1Y && ball.y <= p1Y + paddleH) {
          ball.vx = Math.abs(ball.vx) * 1.05; // speed up
          const delta = ball.y - (p1Y + paddleH / 2);
          ball.vy = delta * 0.2;
          ball.x = 20 + paddleW + ball.r;
          beep(480);
        }
      }

      // Right paddle hit
      if (ball.x + ball.r >= canvas.width - 20 - paddleW && ball.x - ball.r <= canvas.width - 20) {
        if (ball.y >= p2Y && ball.y <= p2Y + paddleH) {
          ball.vx = -Math.abs(ball.vx) * 1.05;
          const delta = ball.y - (p2Y + paddleH / 2);
          ball.vy = delta * 0.2;
          ball.x = canvas.width - 20 - paddleW - ball.r;
          beep(480);
        }
      }

      // Scoring
      if (ball.x < 0) {
        p2Score++;
        beep(200, 0.2);
        if (p2Score >= WIN_SCORE) {
          isGameOver = true;
          winner = mode === '1p' ? 'A CPU Venceu!' : 'Jogador 2 Venceu!';
        } else {
          resetBall(1);
        }
      } else if (ball.x > canvas.width) {
        p1Score++;
        beep(600, 0.2);
        if (p1Score >= WIN_SCORE) {
          isGameOver = true;
          winner = 'Jogador 1 Venceu!';
        } else {
          resetBall(-1);
        }
      }
    }

    function render() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed line
      ctx.strokeStyle = '#1e293b';
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Scores
      ctx.font = '700 48px sans-serif';
      ctx.fillStyle = '#334155';
      ctx.fillText(p1Score, canvas.width / 4, 60);
      ctx.fillText(p2Score, (canvas.width * 3) / 4, 60);

      // Paddles
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(20, p1Y, paddleW, paddleH);
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(canvas.width - 20 - paddleW, p2Y, paddleW, paddleH);

      // Ball
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      // Game over
      if (isGameOver) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#38bdf8';
        ctx.font = '800 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(winner, canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 16px sans-serif';
        ctx.fillText('Clique ou Pressione Espaço para Jogar Novamente', canvas.width / 2, canvas.height / 2 + 30);
      }
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('click', () => {
      if (isGameOver) resetGame();
    });

    loop();
  </script>
</body>
</html>
